services:
  - type: web
    name: marg-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: mock
      - key: STORE_DRIVER
        value: memory
      - key: STRICT_SCOPE
        value: true
      - key: DEFAULT_ANSWER_POLICY
        value: on_request
      - key: CORS_ORIGINS
        value: https://marg-web.onrender.com

  - type: web
    name: marg-web
    runtime: static
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: PUBLIC_MARG_API
        value: https://marg-api.onrender.com
